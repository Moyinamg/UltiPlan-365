<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >
        <title>Check Your Email | UltiPlan 365</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        >
    </head>

    <body>
        <div class="reset-email-page">
            <div class="reset-email-card">
                <div class="reset-email-icon">✉</div>
                <h1>Check Your Email</h1>
                <p>If an account exists with that email, we sent you a password reset link.</p>
                <p>Open the link in your email to create a new password. The reset page may open in a new tab, so you can close this page when you're done.</p>
                <a
                    href="{{ url_for('login') }}"
                    class="reset-email-login-button"
                >
                    Back to Login
                </a>
            </div>
        </div>
    </body>
</html>
